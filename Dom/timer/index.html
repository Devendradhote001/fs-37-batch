<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer UI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Hello, This is Timer</h1>
        <p>Stay focused. Every second counts.</p>

        <div class="timer">

            <div>
                <h1 class="hours">00</h1>
                <p>Hours</p>
            </div>

            <div>
                <h1 class="minutes">00</h1>
                <p>Minutes</p>
            </div>

            <div>
                <h1 class="seconds">00</h1>
                <p>Seconds</p>
            </div>

        </div>

        <span class="status">● Timer Ready</span>

    </div>

    <button id="start">Start</button>

    <script src="script.js"></script>
</body>

</html>
